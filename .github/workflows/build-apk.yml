name: Build Android APK

on:
  push:
    branches: [ "main", "master", "*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          wrapper-validation-enabled: false

      - name: Make Gradle Wrapper Executable and Repair Line Endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Create empty .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Recreate debug.keystore from base64
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi

      - name: Decode Custom Keystore (Optional)
        run: |
          if [ ! -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
          fi

      - name: Build Android APKs (Debug and Signed Release)
        run: ./gradlew assembleDebug assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/my-upload-key.jks"
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK Artifacts
        run: |
          mkdir -p apk-artifacts
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk apk-artifacts/Harmonograph-3D-Signed-Release.apk
          else
            echo "Release APK not found under app/build/outputs/apk/release/app-release.apk"
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk apk-artifacts/Harmonograph-3D-Debug.apk
          else
            echo "Debug APK not found under app/build/outputs/apk/debug/app-debug.apk"
          fi

      - name: Upload APK Artifacts (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Harmonograph-3D-Signed-APKs
          path: apk-artifacts/
          if-no-files-found: error
          retention-days: 14
