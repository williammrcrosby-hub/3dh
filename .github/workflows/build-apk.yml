name: Build Android APK

on:
  push:
    branches: [ "main", "master", "*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Make Gradle Wrapper Executable and Repair Line Endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Create empty .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Recreate debug.keystore from base64
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "debug.keystore.base64 not found or decoding failed, generating keytool fallback"
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Decode Custom Keystore (Optional)
        run: |
          if [ ! -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
          fi

      - name: Build Android APKs (Debug and Signed Release)
        run: gradle assembleDebug assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/my-upload-key.jks"
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK Artifacts
        run: |
          mkdir -p apk-artifacts
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk apk-artifacts/Harmonograph-3D-Signed-Release.apk
          else
            echo "Release APK not found under app/build/outputs/apk/release/app-release.apk"
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk apk-artifacts/Harmonograph-3D-Debug.apk
          else
            echo "Debug APK not found under app/build/outputs/apk/debug/app-debug.apk"
          fi

      - name: Upload APK Artifacts (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Harmonograph-3D-Signed-APKs
          path: apk-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest 3D Harmonograph Pro Build
          body: |
            This release is automatically updated with the latest compiled APK files.
            
            ### Direct Download Links:
            - **[📲 Download Signed Release APK (Recommended)](https://github.com/${{ github.repository }}/releases/download/latest/Harmonograph-3D-Signed-Release.apk)**
            - **[🛠️ Download Debug APK](https://github.com/${{ github.repository }}/releases/download/latest/Harmonograph-3D-Debug.apk)**
          draft: false
          prerelease: false
          make_latest: true
          files: |
            apk-artifacts/Harmonograph-3D-Signed-Release.apk
            apk-artifacts/Harmonograph-3D-Debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
